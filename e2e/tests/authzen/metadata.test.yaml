name: AuthZEN discovery document
steps:
  - action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/.well-known/authzen-configuration
    http_output:
      http_status: 200
      json_body: |
        {
          "policy_decision_point": "[[string]]",
          "access_evaluation_endpoint": "[[string]]",
          "access_evaluations_endpoint": "[[string]]"
        }
