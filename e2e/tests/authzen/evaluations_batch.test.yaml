name: AuthZEN batch - execute_all returns one decision per item in order
before:
  - type: custom_sql
    custom_sql:
      path: batch_fixtures.sql
steps:
  - action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/access/v1/evaluations
    http_request_headers:
      Authorization: "Basic ZTJlbTJtY2xpZW50OmUyZXNlY3JldA=="
      Content-Type: application/json
    http_request_body: |
      {
        "subject": { "type": "user", "id": "{{ .AppID }}-batch-user" },
        "resource": { "type": "authgear:resource", "id": "https://batch.example.com/api" },
        "evaluations": [
          { "action": { "name": "read" } },
          { "action": { "name": "delete" } },
          { "action": { "name": "write" } }
        ],
        "options": { "evaluations_semantic": "execute_all" }
      }
    http_output:
      http_status: 200
      json_body: |
        {
          "evaluations": [
            { "decision": true },
            { "decision": false },
            { "decision": true }
          ]
        }
